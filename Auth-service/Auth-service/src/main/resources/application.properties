spring.application.name=Auth-service
server.port=8081
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${AUTH_DB_USERNAME:auth_app}
spring.datasource.password=${AUTH_DB_PASSWORD:auth_app}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=novastore-auth
app.jwt.ttl-seconds=900
app.internal-token=${AUTH_INTERNAL_TOKEN:}

auth.events.enabled=${AUTH_EVENTS_ENABLED:true}
auth.events.user-created-queue=${AUTH_USER_CREATED_QUEUE:auth.user.created}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
