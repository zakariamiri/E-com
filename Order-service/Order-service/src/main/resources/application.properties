spring.application.name=Order-service
server.port=8084
spring.config.import=optional:configserver:http://localhost:8888
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/order_db}
spring.datasource.username=${POSTGRES_USER:order_user}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=8000
spring.cloud.openfeign.client.config.product-service.connectTimeout=3000
spring.cloud.openfeign.client.config.product-service.readTimeout=8000
spring.cloud.openfeign.client.config.default.retryer=feign.Retryer.Default
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.timelimiter.configs.default.timeout-duration=10s
resilience4j.timelimiter.instances.ProductClientgetProductLong.timeout-duration=10s
resilience4j.timelimiter.instances.ProductClientreserveLongStockRequest.timeout-duration=10s
resilience4j.timelimiter.instances.ProductClientreleaseLongStockRequest.timeout-duration=10s
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
