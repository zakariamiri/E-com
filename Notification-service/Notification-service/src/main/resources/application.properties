spring.application.name=Notification-service
server.port=8083
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:h2:file:./data/notification-db}
spring.datasource.username=${NOTIFICATION_DB_USER:sa}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:449bf59f194a2a}
spring.mail.password=${SMTP_PASSWORD:dae40de8ad1fb9}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.auth.mechanisms=${SMTP_AUTH_MECHANISMS:PLAIN LOGIN CRAM-MD5}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
notification.mail.enabled=${NOTIFICATION_MAIL_ENABLED:true}
notification.mail.from=${NOTIFICATION_MAIL_FROM:no-reply@example.com}
notification.mail.to=${NOTIFICATION_MAIL_TO:test@example.com}
management.endpoints.web.exposure.include=health,info

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
