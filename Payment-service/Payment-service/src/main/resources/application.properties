spring.application.name=Payment-service
server.port=8085
spring.config.import=optional:configserver:http://localhost:8888
services.order.base-url=${ORDER_SERVICE_URL:http://localhost:8084}
spring.cloud.openfeign.client.config.order-service.connect-timeout=750
spring.cloud.openfeign.client.config.order-service.read-timeout=1500
spring.cloud.openfeign.httpclient.hc5.connection-request-timeout=750
spring.cloud.openfeign.httpclient.hc5.connection-request-timeout-unit=milliseconds

spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
spring.datasource.username=${PAYMENT_DB_USERNAME:payment_app}
spring.datasource.password=${PAYMENT_DB_PASSWORD}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

payment.events.queue=${PAYMENT_EVENTS_QUEUE:notifications.payment-status}
